name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps
        working-directory: apps/backend
        run: |
          pip install -e ".[dev]"
      - name: Backend pytest
        run: PYTHONPATH=apps/backend python -m pytest apps/backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install frontend deps
        run: pnpm install
      - name: Typecheck
        run: pnpm --filter frontend typecheck
      - name: Lint
        run: pnpm --filter frontend lint
      - name: Vitest (computed-style MiniPlayer/Shell)
        run: pnpm --filter frontend test
      - name: Build
        run: pnpm --filter frontend build

  e2e-mocked:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install deps
        run: pnpm install
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Build frontend
        run: pnpm --filter frontend build
      - name: Run mocked E2E
        env:
          E2E_BASE_URL: http://localhost:3330
        run: |
          pnpm --filter frontend start --port 3330 &
          npx wait-on http://localhost:3330 --timeout 60000
          pnpm test:e2e -- --project chromium tests/e2e/subtitle-generation-ui.spec.ts tests/e2e/connection-resilience.spec.ts tests/e2e/lock-resume.spec.ts
